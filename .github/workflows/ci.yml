name: CI

# Lint and tests of the module (HotPunch audit F5d [752]). The OSC addresses
# (osc-addresses.js), the colours (colors.js) and the README OSC tables are
# generated from the HotPunch repo (scripts/gen-contracts.py); their match with
# HotPunch's sources is checked there, locally - this repo is nobody's submodule.

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm test
